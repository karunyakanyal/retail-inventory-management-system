apiVersion: apps/v1
kind: Deployment
metadata:
  name: rims-frontend
  namespace: rims
  labels:
    app: rims-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rims-frontend
  template:
    metadata:
      labels:
        app: rims-frontend
    spec:
      containers:
        - name: frontend
          image: rims-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: rims
  labels:
    app: rims-frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: rims-frontend
